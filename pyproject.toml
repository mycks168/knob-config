[project]
name = "knob-config"
version = "0.1.0"
description = "二層ノブ（514c:8850）の設定・診断ツール"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
knob-config = "knob_config:main"
knob-view = "knob_config.viewer:main"
knob-read = "knob_config.readcfg:main"
knob-write = "knob_config.writer:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.coverage.run]
source = ["knob_config"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
